<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* iPhone : empêche le zoom automatique quand on touche un champ (cause du « jeu » gauche-droite) ; le zoom à deux doigts reste possible */
if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) { document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover'); }</script>
<title>Veille et agenda · Vivre Mieux</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5b5d2">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vivre Mieux">
<link rel="stylesheet" href="style.css?v=99">
</head>
<body>
<header class="bandeau">
  <h1 class="bandeau-logo"><img src="logo-vm-blanc.svg" alt="Vivre Mieux Toulouse, groupe municipal d'opposition" width="1260" height="580"></h1>
</header>
<div class="barre-nav">
<nav class="onglets" aria-label="Rubriques">
  <button type="button" data-v="jour" class="on">Actualité</button>
  <button type="button" data-v="agenda">Agenda</button>
  <button type="button" data-v="quartiers">Quartiers</button>
  <button type="button" data-v="archives">Archives</button>
  <button type="button" data-v="sondage">Sondage</button>
  <button type="button" data-v="recherche" aria-label="Rechercher">🔍</button>
</nav>
<div class="moi">
    <select id="moi" hidden aria-hidden="true" tabindex="-1"></select>
    <button type="button" id="cloche" class="cloche" aria-label="Notifications" title="Notifications">🔔<span id="cloche-nb" class="cloche-nb" hidden></span></button>
    <button type="button" id="compte" class="compte clignote" aria-label="Choisir mon prénom" title="Choisir mon prénom">?</button>
  </div>
</div>

<main id="vue" class="page" aria-live="polite">
  <p class="chargement">Chargement…</p>
</main>

<div id="choix-nom" class="modale" hidden>
  <div class="modale-boite" role="dialog" aria-labelledby="choix-titre">
    <h2 id="choix-titre">Qui êtes-vous ?</h2>
    <p>Choisissez votre nom une fois : votre téléphone s'en souviendra. Vous pourrez le changer en haut de la page.</p>
    <div id="choix-liste" class="choix-liste"></div>
  </div>
</div>

<script src="app.js?v=99"></script>
</body>
</html>
